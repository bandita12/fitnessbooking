services:
  db:
    image: postgres:16-alpine
    container_name: fitnessbooking-db
    environment:
      POSTGRES_DB: fitnessbooking
      POSTGRES_USER: fitnessbooking
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
